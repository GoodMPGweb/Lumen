name: Build Lumen for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean --windowed --name Lumen image_editor.py
      - name: Check packaged GUI startup
        run: python tests/smoke_windows.py dist/Lumen/Lumen.exe startup.png
      - name: Upload startup screenshot for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-startup-check
          path: startup.png
          if-no-files-found: ignore
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows
          path: dist/Lumen/
          if-no-files-found: error
